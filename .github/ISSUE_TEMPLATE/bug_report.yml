name: Fehler melden
description: Ein reproduzierbares Problem mit synthetischen Daten beschreiben.
body:
  - type: markdown
    attributes:
      value: >-
        Sicherheitslücken bitte über den privaten Meldeweg aus SECURITY.md melden.
        Keine Zugangsdaten, privaten Schlüssel oder echten Inventare veröffentlichen.
  - type: input
    id: version
    attributes:
      label: Version oder Commit
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Schritte zur Reproduktion
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Erwartetes und tatsächliches Verhalten
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Umgebung und bereinigte Fehlermeldung
