name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CVE_ENV_FILE: configuration/examples/development.env
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Native build headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev python3-dev
      - name: Locked development environment
        run: make setup
      - name: Quality, contracts and secret checks
        run: make check
      - name: Coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-${{ github.sha }}
          path: .runtime/test-reports/coverage.xml
          if-no-files-found: error
      - name: Repository publication inputs
        run: make github-check
      - name: Repository-owned Ansible syntax
        run: make inventory-collect-syntax

  dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Native build headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev python3-dev
      - name: Locked development environment
        run: make setup
      - name: Dashboard types, lint, components and build
        run: make dashboard-check
      - name: Reproducible dashboard contracts
        run: |
          make dashboard-contracts administration-contracts status-contracts
          git diff --exit-code -- contracts/api services/dashboard/src/generated
