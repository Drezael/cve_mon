components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Login:
      properties:
        username:
          type: string
          maxLength: 128
          minLength: 1
          title: Username
        password:
          type: string
          maxLength: 256
          minLength: 1
          format: password
          title: Password
          writeOnly: true
      additionalProperties: false
      type: object
      required:
        - username
        - password
      title: Login
    OTP:
      properties:
        code:
          type: string
          maxLength: 6
          minLength: 6
          format: password
          title: Code
          writeOnly: true
      additionalProperties: false
      type: object
      required:
        - code
      title: OTP
    PasswordChange:
      properties:
        password:
          type: string
          maxLength: 256
          minLength: 1
          format: password
          title: Password
          writeOnly: true
        code:
          anyOf:
            - type: string
              maxLength: 6
              minLength: 6
              format: password
              writeOnly: true
            - type: 'null'
          title: Code
        new_password:
          type: string
          maxLength: 256
          minLength: 15
          format: password
          title: New Password
          writeOnly: true
      additionalProperties: false
      type: object
      required:
        - password
        - new_password
      title: PasswordChange
    Reauthentication:
      properties:
        password:
          type: string
          maxLength: 256
          minLength: 1
          format: password
          title: Password
          writeOnly: true
        code:
          anyOf:
            - type: string
              maxLength: 6
              minLength: 6
              format: password
              writeOnly: true
            - type: 'null'
          title: Code
      additionalProperties: false
      type: object
      required:
        - password
      title: Reauthentication
    Recovery:
      properties:
        code:
          type: string
          maxLength: 80
          minLength: 20
          format: password
          title: Code
          writeOnly: true
      additionalProperties: false
      type: object
      required:
        - code
      title: Recovery
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
        - loc
        - msg
        - type
      title: ValidationError
    Problem:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - code
        - request_id
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        request_id:
          type: string
          format: uuid
    AuthenticationResult:
      type: object
      additionalProperties: false
      properties:
        state:
          enum:
            - unauthenticated
            - password_verified
            - mfa_setup_required
            - mfa_pending
            - mfa_recovery
            - authenticated
            - reauthentication_required
        csrf_token:
          type: string
          minLength: 43
          maxLength: 43
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        mfa_verified:
          type: boolean
        recovery_codes_remaining:
          type: integer
          minimum: 0
          maximum: 10
        provisioning_uri:
          type: string
          description: One authorized enrollment only; no-store, never log.
        recovery_codes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
            minLength: 43
            maxLength: 43
        mfa_enabled:
          type: boolean
          description: User-controlled MFA opt-in; independent of role.
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-cve-session
    LoginCookie:
      type: apiKey
      in: cookie
      name: __Host-cve-login
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
servers:
  - url: https://{dashboard_host}
    variables:
      dashboard_host:
        default: dashboard.example.test:8443
