components:
  schemas:
    Assignment:
      properties:
        reason:
          type: string
          maxLength: 2048
          minLength: 3
          title: Reason
        assignee_user_id:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Assignee User Id
      additionalProperties: false
      type: object
      required:
        - reason
        - assignee_user_id
      title: Assignment
    ExceptionRequest:
      properties:
        reason:
          type: string
          maxLength: 2048
          minLength: 3
          title: Reason
        valid_from:
          type: string
          format: date-time
          title: Valid From
        valid_until:
          type: string
          format: date-time
          title: Valid Until
        scope:
          type: string
          enum:
            - basis
            - episode
          title: Scope
          default: basis
        risk_context:
          type: string
          maxLength: 2048
          minLength: 3
          title: Risk Context
      additionalProperties: false
      type: object
      required:
        - reason
        - valid_from
        - valid_until
        - risk_context
      title: ExceptionRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Mitigation:
      properties:
        reason:
          type: string
          maxLength: 2048
          minLength: 3
          title: Reason
        description:
          type: string
          maxLength: 2048
          minLength: 3
          title: Description
        evidence:
          type: string
          maxLength: 4096
          minLength: 3
          title: Evidence
        scope:
          type: string
          maxLength: 256
          minLength: 3
          title: Scope
        valid_until:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Valid Until
      additionalProperties: false
      type: object
      required:
        - reason
        - description
        - evidence
        - scope
      title: Mitigation
    Note:
      properties:
        reason:
          type: string
          maxLength: 2048
          minLength: 3
          title: Reason
        text:
          type: string
          maxLength: 4096
          minLength: 1
          title: Text
      additionalProperties: false
