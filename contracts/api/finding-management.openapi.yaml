openapi: 3.1.0
info:
  title: Finding Management
  version: 0.18.0
paths:
  /api/v1/findings/summary:
    get:
      tags:
        - findings
      summary: List Findings
      operationId: finding_list_findings_get_summary
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            default: 50
            title: Limit
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            maximum: 100000
            minimum: 0
            default: 0
            title: Offset
        - name: sort
          in: query
          required: false
          schema:
            enum:
              - priority
              - first_detected
              - last_evaluated
              - deadline
              - server
              - cve
            type: string
            default: priority
            title: Sort
        - name: direction
          in: query
          required: false
          schema:
            enum:
              - asc
              - desc
            type: string
            default: asc
            title: Direction
        - name: server_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: 'null'
            title: Server Id
        - name: group_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: 'null'
            title: Group Id
        - name: lifecycle
          in: query
          required: false
          schema:
            anyOf:
              - enum:
                  - open
                  - in_progress
                  - resolved
                  - closed
                type: string
              - type: 'null'
            title: Lifecycle
        - name: priority
          in: query
          required: false
          schema:
            anyOf:
              - enum:
                  - critical
                  - high
                  - medium
                  - low
                  - unrated
                type: string
              - type: 'null'
            title: Priority
        - name: cve_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                maxLength: 256
                pattern: ^CVE-[0-9]{4}-[0-9]{4,}$
              - type: 'null'
            title: Cve Id
        - name: overdue
          in: query
          required: false
          schema:
            anyOf:
              - type: boolean
              - type: 'null'
            title: Overdue
        - name: stale
          in: query
          required: false
          schema:
            anyOf:
              - type: boolean
              - type: 'null'
            title: Stale
        - name: assigned
          in: query
          required: false
          schema:
            anyOf:
              - type: boolean
              - type: 'null'
            title: Assigned
        - name: assignee
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: 'null'
            title: Assignee
        - name: exception
          in: query
          required: false
          schema:
            anyOf:
              - type: boolean
              - type: 'null'
            title: Exception
        - name: kev
          in: query
          required: false
          schema:
            anyOf:
              - type: boolean
              - type: 'null'
            title: Kev
        - name: archived
          in: query
          required: false
          schema:
            anyOf:
              - type: boolean
              - type: 'null'
            title: Archived
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Findings Api V1 Findings Summary Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - SessionCookie: []
      x-permission: finding:read
      x-object-scope: findings_read
      description: Verified dashboard session; current server ACL and function rights
        are revalidated in the transaction. Notes are plain text. Privileged close,
        confirmed-false-positive, exception decisions and policy approval require
        explicit rights and fresh MFA.
