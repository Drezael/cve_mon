openapi: 3.1.0
info:
  title: Personal server groups
  version: 0.11.0
paths:
  /api/v1/dashboard/groups:
    get:
      tags:
        - personal-server-groups
      summary: Groups
      operationId: groups_api_v1_dashboard_groups_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Groups Api V1 Dashboard Groups Get
        '401':
          description: Rejected request
        '403':
          description: Rejected request
        '404':
          description: Rejected request
        '409':
          description: Rejected request
        '422':
          description: Rejected request
      x-permissions:
        - server:read
      security:
        - SessionCookie: []
    post:
      tags:
        - personal-server-groups
      summary: Create
      operationId: create_api_v1_dashboard_groups_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupWrite'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Create Api V1 Dashboard Groups Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Rejected request
        '403':
          description: Rejected request
        '404':
          description: Rejected request
        '409':
          description: Rejected request
      x-permissions:
        - server:read
      security:
        - SessionCookie: []
          CsrfToken: []
  /api/v1/dashboard/groups/{gid}:
    put:
      tags:
        - personal-server-groups
      summary: Update
      operationId: update_api_v1_dashboard_groups__gid__put
      parameters:
        - name: gid
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Gid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupWrite'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Update Api V1 Dashboard Groups  Gid  Put
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Rejected request
        '403':
          description: Rejected request
        '404':
          description: Rejected request
        '409':
          description: Rejected request
      x-permissions:
        - server:read
      security:
        - SessionCookie: []
          CsrfToken: []
    delete:
      tags:
        - personal-server-groups
      summary: Delete
      operationId: delete_api_v1_dashboard_groups__gid__delete
      parameters:
        - name: gid
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Gid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Revision'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Delete Api V1 Dashboard Groups  Gid  Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Rejected request
        '403':
          description: Rejected request
        '404':
          description: Rejected request
        '409':
          description: Rejected request
      x-permissions:
        - server:read
      security:
        - SessionCookie: []
          CsrfToken: []
  /api/v1/dashboard/servers/{sid}/groups:
    put:
      tags:
        - personal-server-groups
      summary: Assign
      operationId: assign_api_v1_dashboard_servers__sid__groups_put
      parameters:
        - name: sid
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Sid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipWrite'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Assign Api V1 Dashboard Servers  Sid  Groups Put
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Rejected request
        '403':
          description: Rejected request
        '404':
          description: Rejected request
        '409':
          description: Rejected request
      x-permissions:
        - server:read
      security:
        - SessionCookie: []
          CsrfToken: []
components:
  schemas:
    GroupWrite:
      properties:
        name:
          type: string
          maxLength: 128
          minLength: 1
          title: Name
        description:
          anyOf:
            - type: string
              maxLength: 2000
            - type: 'null'
          title: Description
        version:
          type: integer
          minimum: 0.0
          title: Version
      additionalProperties: false
      type: object
      required:
        - name
        - version
      title: GroupWrite
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    MembershipWrite:
      properties:
        version:
          type: integer
          minimum: 0.0
          title: Version
        group_ids:
          items:
            type: string
            format: uuid
          type: array
          maxItems: 500
          title: Group Ids
      additionalProperties: false
      type: object
      required:
        - version
        - group_ids
      title: MembershipWrite
    Revision:
      properties:
        version:
          type: integer
          minimum: 0.0
          title: Version
      additionalProperties: false
      type: object
      required:
        - version
      title: Revision
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
        - loc
        - msg
        - type
      title: ValidationError
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-cve-session
    CsrfToken:
      type: apiKey
      in: header
      name: x-csrf-token
