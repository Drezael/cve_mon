    VisibleGroup:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        description:
          anyOf:
            - type: string
            - type: 'null'
          title: Description
        status:
          type: string
          title: Status
        sort_order:
          type: integer
          title: Sort Order
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        archived_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Archived At
        version:
          type: integer
          title: Version
        visible_servers:
          type: integer
          title: Visible Servers
      type: object
      required:
        - id
        - name
        - description
        - status
        - sort_order
        - created_at
        - updated_at
        - archived_at
        - version
        - visible_servers
      title: VisibleGroup
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - code
        - request_id
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        request_id:
          type: string
          format: uuid
    Inventory:
      $schema: https://json-schema.org/draft/2020-12/schema
      title: CVE Monitoring Inventory v1
      description: Unveränderlicher Inventarvertrag; unbekannte Felder sind auf jeder
        Objektebene verboten.
      type: object
      additionalProperties: false
      properties:
        schema_version:
          const: '1.0'
        server_id:
          $ref: '#/components/schemas/Inventory/$defs/uuid'
        inventory_id:
          $ref: '#/components/schemas/Inventory/$defs/uuid'
        captured_at:
          $ref: '#/components/schemas/Inventory/$defs/timestamp'
        collection_status:
          enum:
            - complete
            - partial
            - failed
        collector:
          type: object
          additionalProperties: false
          properties:
            name:
              const: ansible
            version:
              type: string
              minLength: 1
              maxLength: 64
            controller_id:
              type: string
              minLength: 1
              maxLength: 128
          required:
            - name
            - version
        os:
          $ref: '#/components/schemas/Inventory/$defs/os_section'
        packages:
          $ref: '#/components/schemas/Inventory/$defs/package_section'
        services:
          $ref: '#/components/schemas/Inventory/$defs/service_section'
        containers:
          $ref: '#/components/schemas/Inventory/$defs/container_section'
      required:
        - schema_version
        - server_id
        - inventory_id
        - captured_at
        - collection_status
        - collector
        - os
      $defs:
        uuid:
          type: string
          minLength: 1
          maxLength: 36
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        timestamp:
          type: string
          minLength: 1
          maxLength: 40
          format: date-time
          pattern: (Z|[+-][0-9]{2}:[0-9]{2})$
        os_data:
          type: object
          additionalProperties: false
          properties:
            distribution:
              type: string
              minLength: 1
              maxLength: 128
            release:
              type: string
              minLength: 1
              maxLength: 128
            architecture:
              type: string
              minLength: 1
              maxLength: 64
            kernel:
              type: string
              minLength: 1
              maxLength: 256
          required: []
          minProperties: 1
        os_section:
          type: object
          additionalProperties: false
          properties:
            status:
              enum:
                - complete
                - partial
                - failed
                - not_collected
            data:
              $ref: '#/components/schemas/Inventory/$defs/os_data'
            error_code:
              type: string
              minLength: 1
              maxLength: 64
          required:
            - status
          allOf:
            - if:
                properties:
                  status:
                    enum:
                      - complete
                      - partial
              then:
                required:
                  - data
              else:
                not:
                  required:
                    - data
            - if:
                properties:
                  status:
                    const: complete
              then:
                properties:
                  data:
                    required:
                      - distribution
                      - release
                      - architecture
                      - kernel
            - if:
                properties:
                  status:
                    enum:
                      - complete
                      - not_collected
              then:
                not:
                  required:
                    - error_code
        package:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 256
            version:
              type: string
              minLength: 1
              maxLength: 512
            architecture:
              type: string
              minLength: 1
              maxLength: 64
            package_manager:
              enum:
                - dpkg
                - rpm
                - apk
                - pip
                - npm
                - other
            source_package:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 256
                version:
                  type: string
                  minLength: 1
                  maxLength: 512
              required:
                - name
          required:
            - name
            - version
            - architecture
            - package_manager
        package_section:
          type: object
          additionalProperties: false
          properties:
            status:
              enum:
                - complete
                - partial
                - failed
                - not_collected
            items:
              type: array
              maxItems: 100000
              items:
                $ref: '#/components/schemas/Inventory/$defs/package'
            error_code:
              type: string
              minLength: 1
              maxLength: 64
          required:
            - status
          allOf:
            - if:
                properties:
                  status:
                    enum:
                      - complete
                      - partial
              then:
                required:
                  - items
              else:
                not:
                  required:
                    - items
            - if:
                properties:
                  status:
                    const: partial
              then:
                properties:
                  items:
                    minItems: 1
            - if:
                properties:
                  status:
                    enum:
                      - complete
                      - not_collected
              then:
                not:
                  required:
                    - error_code
        service:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 256
            state:
              enum:
                - running
                - stopped
                - failed
                - unknown
            enabled:
              type:
                - boolean
                - 'null'
            version:
              type: string
              minLength: 1
              maxLength: 512
          required:
            - name
            - state
        service_section:
          type: object
          additionalProperties: false
          properties:
            status:
              enum:
                - complete
                - partial
                - failed
                - not_collected
            items:
              type: array
              maxItems: 100000
              items:
                $ref: '#/components/schemas/Inventory/$defs/service'
            error_code:
              type: string
              minLength: 1
              maxLength: 64
          required:
            - status
          allOf:
            - if:
                properties:
                  status:
                    enum:
                      - complete
                      - partial
              then:
                required:
                  - items
              else:
                not:
                  required:
                    - items
            - if:
                properties:
                  status:
                    const: partial
              then:
                properties:
                  items:
                    minItems: 1
            - if:
                properties:
                  status:
                    enum:
                      - complete
                      - not_collected
              then:
                not:
                  required:
                    - error_code
        container:
          type: object
          additionalProperties: false
          properties:
            container_id:
              type: string
              minLength: 1
              maxLength: 128
            image_reference:
              type: string
              minLength: 1
              maxLength: 512
            image_digest:
              type: string
              minLength: 1
              maxLength: 71
              pattern: ^sha256:[0-9a-f]{64}$
            state:
              enum:
                - running
                - stopped
                - paused
                - unknown
            collection_status:
              enum:
                - complete
                - partial
                - failed
          required:
            - container_id
            - image_reference
            - state
            - collection_status
        container_section:
          type: object
          additionalProperties: false
          properties:
            status:
              enum:
                - complete
                - partial
                - failed
                - not_collected
            items:
              type: array
              maxItems: 100000
              items:
                $ref: '#/components/schemas/Inventory/$defs/container'
            error_code:
              type: string
              minLength: 1
              maxLength: 64
          required:
            - status
          allOf:
            - if:
                properties:
                  status:
                    enum:
                      - complete
                      - partial
              then:
                required:
                  - items
              else:
                not:
                  required:
                    - items
            - if:
                properties:
                  status:
                    const: partial
              then:
                properties:
                  items:
                    minItems: 1
            - if:
                properties:
                  status:
                    enum:
                      - complete
                      - not_collected
              then:
                not:
                  required:
                    - error_code
      allOf:
        - if:
            properties:
              collection_status:
                const: complete
          then:
            required:
              - packages
            properties:
              os:
                properties:
                  status:
                    const: complete
              packages:
                properties:
                  status:
                    const: complete
              services:
                properties:
                  status:
                    enum:
                      - complete
                      - not_collected
              containers:
                properties:
                  status:
                    enum:
                      - complete
                      - not_collected
        - if:
            properties:
              collection_status:
                const: failed
          then:
            properties:
              os:
                properties:
                  status:
                    enum:
                      - failed
                      - not_collected
              packages:
                properties:
                  status:
                    enum:
                      - failed
                      - not_collected
              services:
                properties:
                  status:
                    enum:
                      - failed
                      - not_collected
              containers:
                properties:
                  status:
                    enum:
                      - failed
                      - not_collected
        - if:
            properties:
              collection_status:
                const: partial
          then:
            anyOf:
              - required:
                  - os
                properties:
                  os:
                    properties:
                      status:
                        enum:
                          - complete
                          - partial
              - required:
                  - packages
                properties:
                  packages:
                    properties:
                      status:
                        enum:
                          - complete
                          - partial
              - required:
                  - services
                properties:
                  services:
                    properties:
                      status:
                        enum:
                          - complete
                          - partial
              - required:
                  - containers
                properties:
                  containers:
                    properties:
                      status:
                        enum:
                          - complete
                          - partial
  securitySchemes:
    MutualTLS:
      type: mutualTLS
    UploadToken:
      type: http
      scheme: bearer
      bearerFormat: UUID.256-bit-secret
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-cve-session
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
