          title: Criticality
        exposure:
          anyOf:
            - type: string
              enum:
                - internal
                - restricted
                - internet_exposed
                - unknown
            - type: 'null'
          title: Exposure
      additionalProperties: false
      type: object
      title: ServerPatch
    ServerRead:
      properties:
