        display_name:
          type: string
          maxLength: 128
          minLength: 1
          title: Display Name
      additionalProperties: false
      type: object
      required:
        - username
        - email
        - display_name
      title: UserCreate
    UserPatch:
      properties:
        version:
          type: integer
          minimum: 1.0
          title: Version
        reason:
          type: string
          maxLength: 256
          minLength: 1
          title: Reason
        display_name:
          anyOf:
            - type: string
              maxLength: 128
              minLength: 1
            - type: 'null'
          title: Display Name
        email:
          anyOf:
            - type: string
              maxLength: 254
              minLength: 3
              pattern: ^[^\s@]+@[^\s@]+\.[^\s@]+$
