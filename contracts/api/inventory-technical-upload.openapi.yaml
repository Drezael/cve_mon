            - type: 'null'
          title: Description
        environment:
          anyOf:
            - type: string
            - type: 'null'
          title: Environment
        criticality:
          type: string
          enum:
            - low
            - medium
            - high
            - critical
          title: Criticality
        exposure:
          type: string
          enum:
            - internal
