            - type: 'null'
          title: Description
        status:
          type: string
          title: Status
        sort_order:
          type: integer
          title: Sort Order
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        archived_at:
          anyOf:
            - type: string
              format: date-time
