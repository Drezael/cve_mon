            - low
            - medium
            - high
            - critical
          title: Criticality
          default: medium
        exposure:
          type: string
          enum:
            - internal
            - restricted
            - internet_exposed
            - unknown
          title: Exposure
          default: unknown
        request_id:
          type: string
          format: uuid
          title: Request Id
      additionalProperties: false
      type: object
      required:
