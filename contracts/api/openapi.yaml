        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      x-ingress: internal-only
      x-read-only: true
      servers:
        - url: https://cve-api:8000
  /health/ready:
    get:
      operationId: healthReady
      summary: Interne ready-Prüfung
      description: Berechtigung und Objektbereich werden serverseitig geprüft. Keine
        impliziten administrativen Nebenwirkungen.
      security:
        - InternalMTLS: []
          ServiceIdentity: []
      x-permission: health:read
      x-object-scope: global
      x-owner: cve-api
      responses:
        '200':
          description: Erfolgreich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          headers:
            ETag:
              schema:
                type: string
                maxLength: 128
              description: Ressourcenversion, soweit änderbar.
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      x-ingress: internal-only
      x-read-only: true
      servers:
        - url: https://cve-api:8000
components:
  securitySchemes:
    DashboardSession:
      type: apiKey
      in: cookie
      name: __Host-cve-session
      description: Serverseitig widerrufbare Benutzersitzung; MFA für Administratoren.
    PreAuthCookie:
      type: apiKey
      in: cookie
      name: __Host-cve-preauth
      description: Kurzlebige Voranmeldesitzung; besitzt keine Fachberechtigungen.
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
    MutualTLS:
      type: mutualTLS
      description: Pflicht am technischen Nginx-Host, intern vertrauensgebunden weitergegeben.
    UploadToken:
      type: http
      scheme: bearer
      description: Serverbezogener technischer Token, nur inventory:submit.
    ServiceIdentity:
      type: http
      scheme: bearer
      description: Kurzlebiger audience-gebundener Dienstnachweis; zusätzlich interne
        mTLS-Verbindung.
    InternalMTLS:
      type: mutualTLS
      description: Gegenseitiges TLS für interne Dienstidentitäten.
  schemas:
    Inventory:
      $ref: ../inventory/inventory-v1.schema.json
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          maxLength: 256
          format: uri
        title:
          type: string
          maxLength: 256
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          maxLength: 64
        detail:
          type: string
          maxLength: 1024
        request_id:
          type: string
          format: uuid
        errors:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            properties:
              pointer:
                type: string
                maxLength: 256
              message:
                type: string
                maxLength: 256
            required:
              - pointer
              - message
      required:
        - type
        - title
        - status
        - code
        - request_id
    UploadReceipt:
      type: object
      additionalProperties: false
      properties:
        inventory_id:
          type: string
          format: uuid
        server_id:
          type: string
          format: uuid
        job_id:
          type: string
          format: uuid
        outcome:
          enum:
            - accepted
            - duplicate
        source:
          enum:
            - ansible_api
            - dashboard_file
        historical_only:
          type: boolean
        processing_status:
          enum:
            - queued
            - running
            - succeeded
            - failed
      required:
        - inventory_id
        - server_id
        - job_id
        - outcome
        - source
        - historical_only
        - processing_status
    DashboardUpload:
      type: object
      additionalProperties: false
      properties:
        server_id:
          type: string
          format: uuid
        file:
          type: string
          format: binary
          description: Ein UTF-8-JSON-Dokument gemäß Inventory, maximal 10 MiB.
      required:
        - server_id
        - file
    Server:
      type: object
      additionalProperties: false
      properties:
        inventory_name:
          type: string
          maxLength: 256
          minLength: 1
        description:
          type: [string, 'null']
          maxLength: 2048
        environment:
          type: [string, 'null']
          maxLength: 128
        criticality:
          enum: [low, medium, high, critical]
        id:
          type: string
          format: uuid
        hostname:
          type: string
          maxLength: 256
        display_name:
          type: string
          maxLength: 256
        state:
          enum:
            - active
            - inactive
            - archived
        group_ids:
          type: array
          maxItems: 200
          items:
            type: string
            format: uuid
        primary_group_id:
          type:
            - string
            - 'null'
          format: uuid
        version:
          type: integer
          minimum: 1
      required:
        - inventory_name
        - id
        - hostname
        - display_name
        - state
        - group_ids
        - primary_group_id
        - version
    ServerCreate:
      type: object
      additionalProperties: false
      properties:
        inventory_name:
          type: string
          maxLength: 256
          minLength: 1
        description:
          type: [string, 'null']
          maxLength: 2048
        environment:
          type: [string, 'null']
          maxLength: 128
        criticality:
          enum: [low, medium, high, critical]
        hostname:
          type: string
          maxLength: 253
          minLength: 1
        display_name:
          type: string
          maxLength: 128
          minLength: 1
      required:
        - inventory_name
        - hostname
        - display_name
    ServerPatch:
      type: object
      additionalProperties: false
      properties:
        inventory_name:
          type: string
          maxLength: 256
          minLength: 1
        description:
          type: [string, 'null']
          maxLength: 2048
        environment:
          type: [string, 'null']
          maxLength: 128
        criticality:
          enum: [low, medium, high, critical]
        hostname:
          type: string
          maxLength: 253
          minLength: 1
        display_name:
          type: string
          maxLength: 128
          minLength: 1
        enabled:
          type: boolean
      required: []
      minProperties: 1
    Group:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 256
        description:
          type: string
          maxLength: 1024
        version:
          type: integer
          minimum: 1
      required:
        - id
        - name
        - version
    GroupCreate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 128
          minLength: 1
        description:
          type: string
          maxLength: 1024
      required:
        - name
    GroupPatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 128
          minLength: 1
        description:
          type: string
          maxLength: 1024
      required: []
      minProperties: 1
    Memberships:
      type: object
      additionalProperties: false
      properties:
        group_ids:
          type: array
          maxItems: 200
          items:
            type: string
            format: uuid
          uniqueItems: true
        primary_group_id:
          type:
            - string
            - 'null'
          format: uuid
      required:
        - group_ids
        - primary_group_id
    PrimaryGroup:
      type: object
      additionalProperties: false
      properties:
        primary_group_id:
          type:
            - string
            - 'null'
          format: uuid
      required:
        - primary_group_id
    GroupOrder:
      type: object
      additionalProperties: false
      properties:
        ordered_group_ids:
          type: array
          maxItems: 10000
          items:
            type: string
            format: uuid
          uniqueItems: true
      required:
        - ordered_group_ids
    ServerOrder:
      type: object
      additionalProperties: false
      properties:
        ordered_server_ids:
          type: array
          maxItems: 10000
          items:
            type: string
            format: uuid
          uniqueItems: true
      required:
        - ordered_server_ids
    ChangeReason:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 512
          minLength: 1
      required:
        - reason
    CsrfToken:
      type: object
      additionalProperties: false
      properties:
        csrf_token:
          type: string
          maxLength: 256
          minLength: 32
      required:
        - csrf_token
    Login:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
          maxLength: 128
          minLength: 1
        password:
          type: string
          maxLength: 1024
          minLength: 1
          writeOnly: true
      required:
        - username
        - password
    LoginResult:
      type: object
      additionalProperties: false
      properties:
        state:
          enum:
            - authenticated
            - mfa_required
            - mfa_enrollment_required
        challenge_id:
          type:
            - string
            - 'null'
          format: uuid
      required:
        - state
        - challenge_id
    MfaVerify:
      type: object
      additionalProperties: false
      properties:
        challenge_id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 1024
          minLength: 1
          writeOnly: true
          pattern: ^[0-9]{6}$
      required:
        - challenge_id
        - code
    RecoveryVerify:
      type: object
      additionalProperties: false
      properties:
        challenge_id:
          type: string
          format: uuid
        recovery_code:
          type: string
          maxLength: 1024
          minLength: 1
          writeOnly: true
      required:
        - challenge_id
        - recovery_code
    Profile:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          maxLength: 128
        display_name:
          type: string
          maxLength: 128
        role_ids:
          type: array
          maxItems: 200
          items:
            type: string
            format: uuid
        permissions:
          type: array
          maxItems: 200
          items:
            type: string
            maxLength: 128
        mfa_enabled:
          type: boolean
        version:
          type: integer
          minimum: 1
      required:
        - id
        - username
        - display_name
        - role_ids
        - permissions
        - mfa_enabled
        - version
    User:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        id:
          type: string
          format: uuid
        username:
          type: string
          maxLength: 128
        display_name:
          type: string
          maxLength: 128
        state:
          enum:
            - pending_activation
            - active
            - locked
            - disabled
            - archived
        role_ids:
          type: array
          maxItems: 200
          items:
            type: string
            format: uuid
        mfa_enabled:
          type: boolean
        version:
          type: integer
          minimum: 1
      required:
        - email
        - id
        - username
        - display_name
        - state
        - role_ids
        - mfa_enabled
        - version
    UserCreate:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        username:
          type: string
          maxLength: 128
          minLength: 1
        display_name:
          type: string
          maxLength: 128
          minLength: 1
        role_ids:
          type: array
          maxItems: 200
          items:
            type: string
            format: uuid
      required:
        - email
        - username
        - display_name
        - role_ids
    UserPatch:
      type: object
      additionalProperties: false
      properties:
        display_name:
          type: string
          maxLength: 128
          minLength: 1
        enabled:
          type: boolean
        locked:
          type: boolean
      required: []
      minProperties: 1
    RoleAssignment:
      type: object
      additionalProperties: false
      properties:
        role_ids:
          type: array
          maxItems: 200
          items:
            type: string
            format: uuid
          uniqueItems: true
      required:
        - role_ids
    Role:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 128
        permission_codes:
          type: array
          maxItems: 200
          items:
            type: string
            maxLength: 128
        system:
          type: boolean
        version:
          type: integer
          minimum: 1
      required:
        - id
        - name
        - permission_codes
        - system
        - version
    RoleCreate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 128
          minLength: 1
        permission_codes:
          type: array
          maxItems: 200
          items:
            type: string
            maxLength: 128
      required:
        - name
        - permission_codes
    RolePatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 128
          minLength: 1
        permission_codes:
          type: array
          maxItems: 200
          items:
            type: string
            maxLength: 128
      required: []
      minProperties: 1
    ObjectAccess:
      type: object
      additionalProperties: false
      properties:
        server_ids:
          type: array
          maxItems: 10000
          items:
            type: string
            format: uuid
          uniqueItems: true
        group_ids:
          type: array
          maxItems: 10000
          items:
            type: string
            format: uuid
          uniqueItems: true
      required:
        - server_ids
        - group_ids
    PasswordChange:
      type: object
      additionalProperties: false
      properties:
        current_password:
          type: string
          maxLength: 1024
          minLength: 1
          writeOnly: true
        new_password:
          type: string
          maxLength: 1024
          minLength: 14
          writeOnly: true
      required:
        - current_password
        - new_password
    AccountRedeem:
      type: object
      additionalProperties: false
      properties:
        account_token:
          type: string
          maxLength: 1024
          minLength: 1
          writeOnly: true
        new_password:
          type: string
          maxLength: 1024
          minLength: 14
          writeOnly: true
      required:
        - account_token
        - new_password
    AccountTokenReceipt:
      type: object
      additionalProperties: false
      properties:
        token_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
        delivery:
          const: secure_out_of_band
      required:
        - token_id
        - expires_at
        - delivery
    Session:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        current:
          type: boolean
      required:
        - id
        - created_at
        - last_seen_at
        - expires_at
        - current
    MfaEnrollment:
      type: object
      additionalProperties: false
      properties:
        method_id:
          type: string
          format: uuid
        provisioning_uri:
          type: string
          maxLength: 2048
          format: uri
        expires_at:
          type: string
          format: date-time
      required:
        - method_id
        - provisioning_uri
        - expires_at
    MfaConfirm:
      type: object
      additionalProperties: false
      properties:
        method_id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 1024
          minLength: 1
          writeOnly: true
          pattern: ^[0-9]{6}$
      required:
        - method_id
        - code
    RecoveryCodes:
      type: object
      additionalProperties: false
      properties:
        codes:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 128
      required:
        - codes
    TechnicalPrincipal:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        certificate_san:
          type: string
          maxLength: 256
        server_ids:
          type: array
          maxItems: 10000
          items:
            type: string
            format: uuid
        scopes:
          type: array
          maxItems: 200
          items:
            const: inventory:submit
        enabled:
          type: boolean
        version:
          type: integer
          minimum: 1
      required:
        - id
        - certificate_san
        - server_ids
        - scopes
        - enabled
        - version
    TechnicalPrincipalCreate:
      type: object
      additionalProperties: false
      properties:
        certificate_san:
          type: string
          maxLength: 256
          minLength: 1
        server_ids:
          type: array
          maxItems: 10000
          items:
            type: string
            format: uuid
          minItems: 1
          uniqueItems: true
      required:
        - certificate_san
        - server_ids
    TechnicalPrincipalPatch:
      type: object
      additionalProperties: false
      properties:
        server_ids:
          type: array
          maxItems: 10000
          items:
            type: string
            format: uuid
          uniqueItems: true
        enabled:
          type: boolean
      required: []
      minProperties: 1
    IssuedUploadToken:
      type: object
      additionalProperties: false
      properties:
        token_id:
          type: string
          format: uuid
        value:
          type: string
          maxLength: 1024
        expires_at:
          type: string
          format: date-time
      required:
        - token_id
        - value
        - expires_at
    TokenIssue:
      type: object
      additionalProperties: false
      properties:
        expires_at:
          type: string
          format: date-time
      required:
        - expires_at
    Cve:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          maxLength: 32
          pattern: ^CVE-[0-9]{4}-[0-9]{4,}$
        state:
          enum:
            - published
            - rejected
            - reserved
        description:
          type: string
          maxLength: 65536
        published_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type: string
          format: date-time
        revision_id:
          type: string
          format: uuid
        sources:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
                maxLength: 128
              fetched_at:
                type: string
                format: date-time
              revision:
                type: string
                maxLength: 256
            required:
              - name
              - fetched_at
              - revision
        affected:
          type: array
          maxItems: 10000
          items:
            type: object
            additionalProperties: false
            properties:
              vendor:
                type: string
                maxLength: 256
              product:
                type: string
                maxLength: 256
              ecosystem:
                type: string
                maxLength: 128
              version_range_source:
                type: string
                maxLength: 2048
            required:
              - vendor
              - product
              - version_range_source
        severity:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            properties:
              source:
                type: string
                maxLength: 128
              vector_version:
                type: string
                maxLength: 32
              vector:
                type: string
                maxLength: 512
              score:
                type: number
                minimum: 0
                maximum: 10
            required:
              - source
              - vector_version
              - vector
              - score
        kev:
          type:
            - boolean
            - 'null'
        references:
          type: array
          maxItems: 1000
          items:
            type: string
            maxLength: 2048
            format: uri
      required:
        - id
        - state
        - description
        - published_at
        - updated_at
        - revision_id
        - sources
    InventorySummary:
      type: object
      additionalProperties: false
      properties:
        inventory_id:
          type: string
          format: uuid
        server_id:
          type: string
          format: uuid
        captured_at:
          type: string
          format: date-time
        received_at:
          type: string
          format: date-time
        collection_status:
          enum:
            - complete
            - partial
            - failed
        processing_status:
          enum:
            - queued
            - running
            - succeeded
            - failed
        historical_only:
          type: boolean
      required:
        - inventory_id
        - server_id
        - captured_at
        - received_at
        - collection_status
        - processing_status
        - historical_only
    Match:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        server_id:
          type: string
          format: uuid
        inventory_id:
          type: string
          format: uuid
        cve_id:
          type: string
          maxLength: 32
        component:
          type: string
          maxLength: 256
        installed_version:
          type: string
          maxLength: 512
        status:
          enum:
            - affected
            - potentially_affected
            - not_affected
            - fixed
            - under_investigation
            - not_evaluable
        rule_version:
          type: string
          maxLength: 128
        source_revision_id:
          type: string
          format: uuid
        reason:
          type: string
          maxLength: 2048
        evaluated_at:
          type: string
          format: date-time
      required:
        - id
        - server_id
        - inventory_id
        - cve_id
        - component
        - installed_version
        - status
        - rule_version
        - source_revision_id
        - reason
        - evaluated_at
    Finding:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        server_id:
          type: string
          format: uuid
        cve_id:
          type: string
          maxLength: 32
        component:
          type: string
          maxLength: 256
        status:
          enum:
            - open
            - under_review
            - mitigated
            - resolved
            - accepted_risk
            - false_positive
            - reopened
        risk:
          enum:
            - critical
            - high
            - medium
            - low
            - unknown
        last_evaluated_at:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
      required:
        - id
        - server_id
        - cve_id
        - component
        - status
        - risk
        - last_evaluated_at
        - version
    FindingPatch:
      type: object
      additionalProperties: false
      properties:
        status:
          enum:
            - open
            - under_review
            - mitigated
            - resolved
            - accepted_risk
            - false_positive
            - reopened
        reason:
          type: string
          maxLength: 1024
          minLength: 1
      required:
        - status
        - reason
    RiskAssessment:
      type: object
      additionalProperties: false
      properties:
        finding_id:
          type: string
          format: uuid
        priority:
          enum:
            - critical
            - high
            - medium
            - low
            - unknown
        cvss_score:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 10
        kev:
          type:
            - boolean
            - 'null'
        reason:
          type: string
          maxLength: 2048
        rule_version:
          type: string
          maxLength: 128
