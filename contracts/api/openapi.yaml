openapi: 3.1.0
info:
  title: CVE Security Monitoring Platform API
  version: 1.1.0
  description: Verbindlicher Phase-0-Vertrag. Keine implementierten Endpunkte. Sicherheitsgrenzen
    und Datenhoheit gelten zusätzlich zu syntaktischer Validierung.
servers:
  - url: /
    description: Gleiche HTTPS-Origin; technischer Upload ausschließlich auf dediziertem
      mTLS-Host.
paths:
  /api/v1/inventories:
    post:
      operationId: submitInventory
      summary: Technisches Ansible Submit
      description: 10 MiB UTF-8-JSON; Pflicht-mTLS plus Token-Principal, Serverbindung,
        atomare Annahme und trusted source=ansible_api. Siehe Inventar-Ablehnungsvertrag.
      security:
        - MutualTLS: []
          UploadToken: []
      x-permission: inventory:submit
      x-object-scope: server_id
      x-owner: cve-api
      responses:
        '202':
          description: Dauerhaft angenommen, Verarbeitung ausstehend
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadReceipt'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
        '200':
          description: Identisches Inventar bereits vorhanden; kein zweiter Fachjob.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadReceipt'
      x-ingress: technical-mtls-only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Inventory'
  /api/v1/dashboard/inventories/upload:
    post:
      operationId: uploadDashboardInventory
      summary: Manueller Dashboard-Datei-Upload
      description: Ein JSON-File und Zielserver-ID, 10 MiB Datei/11 MiB Multipart.
        Datei-ID muss Ziel-ID entsprechen; trusted source=dashboard_file. Gleicher
        fachlicher Annahmevertrag wie Submit.
      security:
        - DashboardSession: []
          CsrfToken: []
      x-permission: inventory:upload:dashboard
      x-object-scope: server_id
      x-owner: cve-api
      responses:
        '202':
          description: Dauerhaft angenommen, Verarbeitung ausstehend
