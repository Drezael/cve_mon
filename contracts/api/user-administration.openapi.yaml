components:
  schemas:
    Activation:
      properties:
        activation_token:
          type: string
          maxLength: 100
          minLength: 70
          format: password
          title: Activation Token
          writeOnly: true
        new_password:
          type: string
          maxLength: 256
          minLength: 15
          format: password
          title: New Password
          writeOnly: true
      additionalProperties: false
      type: object
      required:
        - activation_token
        - new_password
      title: Activation
    AssignRoles:
      properties:
        version:
          type: integer
          minimum: 1.0
          title: Version
        reason:
          type: string
          maxLength: 256
          minLength: 1
          title: Reason
        role_ids:
          items:
            type: string
            format: uuid
          type: array
          maxItems: 20
          title: Role Ids
      additionalProperties: false
      type: object
      required:
        - version
        - reason
        - role_ids
      title: AssignRoles
    Grant:
      properties:
        user_id:
          type: string
          format: uuid
          title: User Id
        rights:
          items:
            type: string
            enum:
              - view
              - inventory_upload
              - findings_read
              - findings_manage
          type: array
          maxItems: 4
          minItems: 1
          title: Rights
      additionalProperties: false
      type: object
      required:
        - user_id
        - rights
      title: Grant
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Login:
      properties:
        username:
          type: string
          maxLength: 128
          minLength: 1
          title: Username
        password:
          type: string
          maxLength: 256
          minLength: 1
          format: password
          title: Password
          writeOnly: true
      additionalProperties: false
      type: object
      required:
        - username
        - password
      title: Login
    OTP:
      properties:
        code:
          type: string
          maxLength: 6
          minLength: 6
          format: password
          title: Code
          writeOnly: true
      additionalProperties: false
      type: object
      required:
        - code
      title: OTP
    PasswordChange:
      properties:
        password:
          type: string
          maxLength: 256
          minLength: 1
          format: password
          title: Password
          writeOnly: true
        code:
          anyOf:
            - type: string
              maxLength: 6
              minLength: 6
              format: password
              writeOnly: true
            - type: 'null'
          title: Code
        new_password:
          type: string
          maxLength: 256
          minLength: 15
          format: password
          title: New Password
          writeOnly: true
      additionalProperties: false
      type: object
      required:
        - password
        - new_password
      title: PasswordChange
    Reauthentication:
      properties:
        password:
          type: string
          maxLength: 256
          minLength: 1
          format: password
          title: Password
          writeOnly: true
        code:
          anyOf:
            - type: string
              maxLength: 6
              minLength: 6
              format: password
              writeOnly: true
            - type: 'null'
          title: Code
      additionalProperties: false
      type: object
      required:
        - password
      title: Reauthentication
    Recovery:
      properties:
        code:
          type: string
          maxLength: 80
          minLength: 20
          format: password
          title: Code
          writeOnly: true
      additionalProperties: false
      type: object
      required:
        - code
      title: Recovery
    RecoveryHandoff:
      properties:
        recovery_token:
          type: string
          maxLength: 100
          minLength: 70
          format: password
          title: Recovery Token
          writeOnly: true
      additionalProperties: false
      type: object
      required:
        - recovery_token
      title: RecoveryHandoff
    ReplaceAccess:
      properties:
        version:
          type: integer
          minimum: 0.0
          title: Version
        reason:
          type: string
          maxLength: 256
          minLength: 1
          title: Reason
        grants:
          items:
            $ref: '#/components/schemas/Grant'
          type: array
          maxItems: 100
          title: Grants
      additionalProperties: false
      type: object
      required:
        - version
        - reason
        - grants
      title: ReplaceAccess
    RoleCreate:
      properties:
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]{2,63}$
          title: Code
        name:
          type: string
          maxLength: 128
          minLength: 1
          title: Name
        description:
          type: string
          maxLength: 512
          title: Description
          default: ''
        permissions:
          items:
            type: string
          type: array
          maxItems: 40
          title: Permissions
      additionalProperties: false
      type: object
      required:
        - code
        - name
        - permissions
      title: RoleCreate
    RolePatch:
      properties:
        version:
          type: integer
          minimum: 1.0
          title: Version
        reason:
          type: string
          maxLength: 256
          minLength: 1
          title: Reason
        name:
          type: string
          maxLength: 128
          minLength: 1
          title: Name
        description:
          type: string
          maxLength: 512
          title: Description
          default: ''
        permissions:
          items:
            type: string
          type: array
          maxItems: 40
          title: Permissions
      additionalProperties: false
      type: object
      required:
        - version
        - reason
        - name
        - permissions
      title: RolePatch
    UserCreate:
      properties:
        username:
          type: string
          maxLength: 128
          minLength: 1
          title: Username
        email:
          type: string
          maxLength: 254
          minLength: 3
          pattern: ^[^\s@]+@[^\s@]+\.[^\s@]+$
          title: Email
        display_name:
          type: string
          maxLength: 128
          minLength: 1
          title: Display Name
      additionalProperties: false
      type: object
      required:
        - username
        - email
        - display_name
      title: UserCreate
    UserPatch:
      properties:
        version:
          type: integer
          minimum: 1.0
          title: Version
        reason:
          type: string
          maxLength: 256
          minLength: 1
          title: Reason
        display_name:
          anyOf:
            - type: string
              maxLength: 128
              minLength: 1
            - type: 'null'
          title: Display Name
        email:
          anyOf:
            - type: string
              maxLength: 254
              minLength: 3
              pattern: ^[^\s@]+@[^\s@]+\.[^\s@]+$
            - type: 'null'
          title: Email
      additionalProperties: false
      type: object
      required:
        - version
        - reason
      title: UserPatch
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
        - loc
        - msg
        - type
      title: ValidationError
    Version:
      properties:
        version:
          type: integer
          minimum: 1.0
          title: Version
        reason:
          type: string
          maxLength: 256
          minLength: 1
          title: Reason
      additionalProperties: false
      type: object
      required:
        - version
        - reason
      title: Version
    Problem:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - code
        - request_id
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        request_id:
          type: string
          format: uuid
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-cve-session
    LoginCookie:
      type: apiKey
      in: cookie
      name: __Host-cve-login
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
