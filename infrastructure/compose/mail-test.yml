# Optional: ./cve_mon mail-test start; never included by a normal start.
services:
  cve-mailhog:
    profiles: [mail-test]
    image: "mailhog/mailhog:v1.0.1@sha256:8d76a3d4ffa32a3661311944007a41533\
      2c4bb855657f4f6c57996405c009bea"
    user: '1000:1000'
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    environment:
      MH_STORAGE: maildir
      MH_MAILDIR_PATH: /home/mailhog/maildir
    networks:
      cve_outbound:
        aliases:
          - mailhog.cve.test
    ports:
      - target: 8025
        published: 8025
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - type: bind
        source: ${MOUNT_BASE:-./.runtime}/storage/${COMPOSE_PROJECT_NAME:-cve-monitoring}/mailhog
        target: /home/mailhog
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8025/api/v2/messages]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'
    labels:
      org.cve-monitoring.project: ${COMPOSE_PROJECT_NAME:-cve-monitoring}
