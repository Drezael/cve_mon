# Native rsyslog configuration: only bounded transport evidence, no envelopes or replies.
global(parser.permitSlashInProgramName="on")
module(load="imuxsock")
template(name="cve_safe" type="list") {
    constant(value="{\"time\": \"") property(name="timereported" dateFormat="rfc3339")
    constant(value="\", \"component\": \"") property(name="programname" format="json")
    constant(value="\", \"severity\": \"") property(name="syslogseverity-text")
    constant(value="\", \"event\": \"") property(name="$!cve_event" format="json")
    constant(value="\", \"queue_id\": \"") property(name="$!cve_queue" format="json")
    constant(value="\"}\n")
}
if ($programname startswith "cve-postfix/") then {
    set $!cve_event = "diagnostic";
    set $!cve_queue = re_extract($msg, "^ ([A-F0-9]{5,32}):", 0, 1, "");
    if ($programname == "cve-postfix/smtp") then {
        # Native delivery metadata ends before the parenthesized upstream response.
        set $!cve_event = re_extract($msg, "^ [A-F0-9]{5,32}: to=<[^>]*>, [^(]*, status=(sent|deferred|bounced|expired) ", 0, 1, "diagnostic");
    }
    if ($programname == "cve-postfix/qmgr" and $msg contains "status=expired") then {
        set $!cve_event = "expired";
    }
    action(type="omfile" file="/dev/stdout" template="cve_safe")
}
stop
