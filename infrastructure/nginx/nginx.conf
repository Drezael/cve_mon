worker_processes 2;
pid /tmp/nginx.pid;
# Native Request-Fehlerlogs können Query-Strings enthalten. HTTP-Fehler stehen
# stattdessen strukturiert im Accesslog; nginx -t liefert Konfigurationsdiagnosen.
error_log /dev/null;
events {
    worker_connections 1024;
}
http {
    include /etc/nginx/mime.types;
    default_type application/json;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    include /etc/nginx/cve/snippets/logging.conf;
    access_log /dev/stdout cve_json;
    include /etc/nginx/cve/http.conf;
    include /etc/nginx/cve/conf.d/*.conf;
}
