# Phase 8: HTTP inside the private cve_internal network; public TLS terminates at Nginx.
# The auth location adds a private ingress gate and never accepts client identity claims.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Request-ID $request_id;
proxy_set_header Forwarded "";
proxy_set_header Connection "";
proxy_set_header Upgrade "";
proxy_set_header X-CVE-Client-Cert "";
proxy_set_header X-CVE-Client-Subject "";
proxy_set_header X-CVE-Cert-SHA256 "";
proxy_set_header X-SSL-Client-Verify "";
proxy_set_header X-SSL-Client-Cert "";
proxy_connect_timeout 3s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;
proxy_set_header X-CVE-Inventory-Gateway "";
proxy_set_header X-CVE-Inventory-Scheme "";
proxy_set_header X-CVE-Inventory-Verify "";
proxy_set_header X-CVE-Inventory-Certificate "";
