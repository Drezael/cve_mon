map $request_method $log_method {
    default OTHER;
    GET GET;
    HEAD HEAD;
    POST POST;
    PUT PUT;
    PATCH PATCH;
    DELETE DELETE;
    OPTIONS OPTIONS;
}
map $uri $log_path {
    default /<unmatched>;
    / /;
    /healthz /healthz;
    /api/v1/inventories /api/v1/inventories;
    /api/v1/dashboard/inventories/upload /api/v1/dashboard/inventories/upload;
    ~^/api/v1/dashboard/admin/ /api/v1/dashboard/admin/*;
    ~^/api/v1/ /api/v1/*;
}
map $status $error_class {
    default none;
    400 invalid_request;
    403 forbidden;
    404 unknown_route;
    405 method;
    408 timeout;
    413 body_too_large;
    421 host_mismatch;
    426 https_required;
    429 rate_limited;
    503 backend_unavailable;
}
log_format cve_json escape=json
    '{"timestamp":"$time_iso8601","request_id":"$request_id",'
    '"host":"$server_name","method":"$log_method","path":"$log_path",'
    '"status":$status,"duration":$request_time,"upstream_status":"$upstream_status",'
    '"upstream_duration":"$upstream_response_time","error_class":"$error_class"}';
