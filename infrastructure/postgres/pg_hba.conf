# Unix-Socket ausschließlich für kontrollierte Wartung innerhalb des Containers.
local all postgres_admin peer map=cve_admin
local all all reject
# Netzwerk immer TLS und SCRAM; Datenbank-ACLs begrenzen CONNECT zusätzlich.
hostssl all postgres_admin 0.0.0.0/0 scram-sha-256
hostssl cve_monitoring cve_migrator,api_reader,api_ingest,api_security,dashboard_admin,inventory_processor,importer,enricher,matcher,findings_writer,reporter,event_dispatcher,notification,status_probe,dashboard_preferences,workflow_control,ansible_worker 0.0.0.0/0 scram-sha-256
hostssl n8n n8n_app 0.0.0.0/0 scram-sha-256
host all all 0.0.0.0/0 reject
host all all ::/0 reject
