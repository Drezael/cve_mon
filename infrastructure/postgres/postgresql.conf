listen_addresses = '*'
port = 5432
hba_file = '/etc/postgresql/pg_hba.conf'
ident_file = '/etc/postgresql/pg_ident.conf'
unix_socket_directories = '/var/run/postgresql'
# Algorithmusauswahl, kein Credential.
password_encryption = 'scram-sha-256' # pragma: allowlist secret
ssl = on
ssl_cert_file = '/var/run/postgresql/tls/server.crt'
ssl_key_file = '/var/run/postgresql/tls/server.key'
ssl_min_protocol_version = 'TLSv1.2'
timezone = 'UTC'
log_timezone = 'UTC'
max_connections = 96
shared_buffers = '512MB'
work_mem = '4MB'
# Short import/enrichment transactions do not benefit from repeated LLVM compilation.
jit = off
maintenance_work_mem = '32MB'
wal_level = replica
max_wal_size = '8GB'
checkpoint_timeout = '10min'
checkpoint_completion_target = 0.9
autovacuum = on
logging_collector = off
log_destination = 'stderr'
log_line_prefix = '%m [%p] db=%d user=%u '
log_statement = 'none'
log_connections = off
log_disconnections = off
log_duration = off
log_error_verbosity = terse
log_min_error_statement = panic
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
