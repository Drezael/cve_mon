[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
license = "PolyForm-Noncommercial-1.0.0"
name = "cve-automation"
version = "0.25.0"
requires-python = ">=3.12,<3.13"
dependencies = ["cve-common==0.7.0", "ansible-core==2.21.5", "ansible-runner==2.4.3", "cryptography==50.0.2", "bcrypt==5.0.0", "uvicorn==0.54.0"]

[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
cve_automation = ["py.typed", "data/*", "playbooks/*.yml"]
