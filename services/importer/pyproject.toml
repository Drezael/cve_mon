[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
license = "PolyForm-Noncommercial-1.0.0"
name = "cve-importer"
version = "0.15.0"
requires-python = ">=3.12,<3.13"
description = "Source-isolated, checkpointed CVE/advisory importer"
dependencies = ["cve-common==0.7.0", "uvicorn==0.54.0", "jsonschema==4.26.0", "rfc3339-validator==0.1.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cve_importer = ["py.typed", "data/**/*", "data/*.json"]
